services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traceguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceguard_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-traceguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-traceguard}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - front

  # §13.4: migrate as the owner, then enable the least-privilege logins the
  # services below connect with. Runs once per `compose up`; the api and the
  # gateway wait for it, so a clean clone never boots against an unmigrated
  # database or a role that cannot log in yet.
  db-roles:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-traceguard}
      PGPASSWORD: ${POSTGRES_PASSWORD:-traceguard_dev_only}
      PGDATABASE: ${POSTGRES_DB:-traceguard}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api_dev_pw}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway_dev_pw}
      RETENTION_DB_PASSWORD: ${RETENTION_DB_PASSWORD:-retention_dev_pw}
      PUBLISHER_DB_PASSWORD: ${PUBLISHER_DB_PASSWORD:-publisher_dev_pw}
    volumes:
      - ./apps/api/migrations:/migrations:ro
      - ./infra/postgres/bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - front
    restart: "no"

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    # Named so the gateway reuses this build instead of keeping a second
    # image that can silently go stale.
    image: traceguard-api
    environment:
      DATABASE_URL: postgres://api_runtime:${API_DB_PASSWORD:-api_dev_pw}@postgres:5432/${POSTGRES_DB:-traceguard}
      DATABASE_URL_RETENTION: postgres://retention_job:${RETENTION_DB_PASSWORD:-retention_dev_pw}@postgres:5432/${POSTGRES_DB:-traceguard}
      API_KEY: ${API_KEY:-dev_key_change_me}
      # The dashboard exchanges the approver key for a session on the API
      # listener too; without it here the approver half of the connect fails.
      APPROVER_KEY: ${APPROVER_KEY:-dev_approver_change_me}
      # ADR-0010: the API resolves no upstream credential. Discovery is
      # delegated to the gateway's internal listener on the private network.
      GATEWAY_INTERNAL_URL: http://gateway:8094
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-dev_internal_change_me}
      PORT: 8080
    ports:
      - "8090:8080" # 8080 is taken on some dev machines, public side stays off it
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    networks:
      - front

  gateway:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    image: traceguard-api
    command: ["node", "apps/api/dist/gateway.js"]
    environment:
      DATABASE_URL: postgres://gateway_runtime:${GATEWAY_DB_PASSWORD:-gateway_dev_pw}@postgres:5432/${POSTGRES_DB:-traceguard}
      API_KEY: ${API_KEY:-dev_key_change_me}
      # The agent network can reach only the gateway; the gateway forwards the
      # fixed telemetry write path (/v1/ingest/events) to the API (§24, FR-004).
      CONTROL_API_URL: http://api:8080
      APPROVER_KEY: ${APPROVER_KEY:-dev_approver_change_me}
      APPROVAL_ARGS_KEY: ${APPROVAL_ARGS_KEY}
      APPROVAL_ARGS_KEY_PREVIOUS: ${APPROVAL_ARGS_KEY_PREVIOUS:-}
      GATEWAY_PORT: 8091
      # §9: human approvals live on their own control listener so agent
      # credentials never reach the queue or decisions.
      GATEWAY_CONTROL_PORT: 8093
      # ADR-0010: service-to-service discovery listener. It stays on `front`
      # and is never published; only the API is meant to reach it.
      GATEWAY_INTERNAL_PORT: 8094
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-dev_internal_change_me}
      APPROVAL_TTL_SECONDS: ${APPROVAL_TTL_SECONDS:-900}
      APPROVAL_CLAIM_LEASE_SECONDS: ${APPROVAL_CLAIM_LEASE_SECONDS:-30}
      # §10.2/FR-019: the gateway may verify a checkpoint, never sign one. The
      # private key stays on the operator host and is used by
      # `pnpm audit:checkpoint`; only the public key is mounted here.
      AUDIT_CHECKPOINT_PUBLIC_KEY: ${AUDIT_CHECKPOINT_PUBLIC_KEY:-}
      # Demo upstream (mock-tools) lives on the private `tools` network, so
      # the reference deployment opts in explicitly. FR-005: production
      # deployments leave this off and rely on egress controls.
      ALLOW_PRIVATE_UPSTREAMS: "true"
      # §13.3: the gateway records the highest policy version it accepted so a
      # rolled-back pointer fails closed. The volume is writable only by the
      # gateway, and it must survive restarts to keep that anchor meaningful.
      GATEWAY_STATE_DIR: /app/gateway-state
    volumes:
      - gateway_state:/app/gateway-state
    ports:
      - "8091:8091"
      # The control listener is only meaningfully separated by credential in
      # the Compose reference (the agent shares agent_edge with the gateway);
      # production topologies keep this port off the agent network entirely.
      - "8093:8093"
    healthcheck:
      # The agent waits for this, and tests/security/bypass.mjs treats a
      # healthy gateway on agent_edge as the "gateway can" half of FR-004.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    networks:
      - front
      - tools
      - agent_edge

  # Demo upstream only. It lives on the tools network with no route from
  # agents or the public side, which is what makes gateway enforcement real.
  mock-tools:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./examples/mock-tools:/app/examples/mock-tools:ro
      - ./node_modules:/app/node_modules:ro
      - ./apps/api/node_modules:/app/apps/api/node_modules:ro
    command: ["node", "examples/mock-tools/server.mjs"]
    environment:
      MOCK_TOOLS_PORT: 8092
    networks:
      - tools

  # FR-004: the agent sits on agent_edge only. It reaches the gateway and
  # nothing else — not postgres, not the api, and not the tools network the
  # upstream lives on. tests/security/bypass.mjs asserts exactly that from
  # inside this container, and README's demo flow runs here.
  agent:
    build:
      context: .
      dockerfile: ./examples/demo-agent/Dockerfile
    environment:
      TRACEGUARD_URL: http://gateway:8091
      TRACEGUARD_API_KEY: ${API_KEY:-dev_key_change_me}
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - agent_edge

  # §11.3/§11.4/§12.3: orphaned runs, unresolved parents, abandoned budget
  # holds and retention rules are cron endpoints on the API. This service is
  # the scheduler; it holds only the admin key and sits on `front`.
  maintenance:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./scripts/maintenance.mjs:/app/maintenance.mjs:ro
    command: ["node", "maintenance.mjs"]
    environment:
      TRACEGUARD_URL: http://api:8080
      API_KEY: ${API_KEY:-dev_key_change_me}
      MAINTENANCE_TOKEN: ${MAINTENANCE_TOKEN:-}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-300}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - front

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    ports:
      - "5173:8080"
    networks:
      - front

networks:
  front:
  tools:
    internal: true
  # FR-004: agent_edge carries the agent's traffic to the gateway and nothing
  # else. The gateway is the only container with a foot on both sides.
  agent_edge:

volumes:
  pgdata:
  gateway_state:
