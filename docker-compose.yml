services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traceguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceguard_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-traceguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-traceguard}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - front

  # §13.4: migrate as the owner, then enable the least-privilege logins the
  # services below connect with. Runs once per `compose up`; the api and the
  # gateway wait for it, so a clean clone never boots against an unmigrated
  # database or a role that cannot log in yet.
  db-roles:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-traceguard}
      PGPASSWORD: ${POSTGRES_PASSWORD:-traceguard_dev_only}
      PGDATABASE: ${POSTGRES_DB:-traceguard}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api_dev_pw}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway_dev_pw}
      RETENTION_DB_PASSWORD: ${RETENTION_DB_PASSWORD:-retention_dev_pw}
      PUBLISHER_DB_PASSWORD: ${PUBLISHER_DB_PASSWORD:-publisher_dev_pw}
    volumes:
      - ./apps/api/migrations:/migrations:ro
      - ./infra/postgres/bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - front
    restart: "no"

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://api_runtime:${API_DB_PASSWORD:-api_dev_pw}@postgres:5432/${POSTGRES_DB:-traceguard}
      DATABASE_URL_RETENTION: postgres://retention_job:${RETENTION_DB_PASSWORD:-retention_dev_pw}@postgres:5432/${POSTGRES_DB:-traceguard}
      API_KEY: ${API_KEY:-dev_key_change_me}
      PORT: 8080
    ports:
      - "8090:8080" # 8080 is taken on some dev machines, public side stays off it
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    networks:
      - front

  gateway:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    command: ["node", "apps/api/dist/gateway.js"]
    environment:
      DATABASE_URL: postgres://gateway_runtime:${GATEWAY_DB_PASSWORD:-gateway_dev_pw}@postgres:5432/${POSTGRES_DB:-traceguard}
      API_KEY: ${API_KEY:-dev_key_change_me}
      APPROVER_KEY: ${APPROVER_KEY:-dev_approver_change_me}
      APPROVAL_ARGS_KEY: ${APPROVAL_ARGS_KEY}
      APPROVAL_ARGS_KEY_PREVIOUS: ${APPROVAL_ARGS_KEY_PREVIOUS:-}
      GATEWAY_PORT: 8091
      APPROVAL_TTL_SECONDS: ${APPROVAL_TTL_SECONDS:-300}
      ALLOW_PRIVATE_UPSTREAMS: "true"
      # §13.3: the gateway records the highest policy version it accepted so a
      # rolled-back pointer fails closed. The volume is writable only by the
      # gateway, and it must survive restarts to keep that anchor meaningful.
      GATEWAY_STATE_DIR: /app/gateway-state
    volumes:
      - gateway_state:/app/gateway-state
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    networks:
      - front
      - tools

  # Demo upstream only. It lives on the tools network with no route from
  # agents or the public side, which is what makes gateway enforcement real.
  mock-tools:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./examples/mock-tools:/app/examples/mock-tools:ro
      - ./node_modules:/app/node_modules:ro
      - ./apps/api/node_modules:/app/apps/api/node_modules:ro
    command: ["node", "examples/mock-tools/server.mjs"]
    environment:
      MOCK_TOOLS_PORT: 8092
    networks:
      - tools

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    ports:
      - "5173:80"
    networks:
      - front

networks:
  front:
  tools:
    internal: true

volumes:
  pgdata:
  gateway_state:
