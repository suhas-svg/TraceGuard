# Served unprivileged (k8s runAsNonRoot): the default :80 listener cannot bind
# without root, so the cluster serves 8080. The Service keeps port 80.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
}
