apiVersion: v1
kind: ConfigMap
metadata:
  name: traceguard-config
  namespace: traceguard
data:
  PORT: "8080"
  GATEWAY_PORT: "8091"
  APPROVAL_TTL_SECONDS: "300"
  ALLOW_PRIVATE_UPSTREAMS: "false"
  DASHBOARD_ORIGIN: "http://localhost:5173"
  # The gateway's accepted-policy-version anchor (backed by the gateway-state
  # PVC in gateway.yaml).
  GATEWAY_STATE_DIR: "/var/lib/traceguard/gateway-state"
