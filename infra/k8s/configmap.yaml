apiVersion: v1
kind: ConfigMap
metadata:
  name: traceguard-config
  namespace: traceguard
data:
  PORT: "8080"
  GATEWAY_PORT: "8091"
  # §9: human approval queue/decisions listen here, away from the agent port.
  GATEWAY_CONTROL_PORT: "8093"
  # ADR-0010: internal discovery listener, reachable from api pods only.
  GATEWAY_INTERNAL_PORT: "8094"
  GATEWAY_INTERNAL_URL: "http://gateway:8094"
  CONTROL_API_URL: "http://api:8080"
  APPROVAL_TTL_SECONDS: "900"
  APPROVAL_CLAIM_LEASE_SECONDS: "30"
  # §10.2/FR-019: the gateway verifies operator-signed checkpoints but never
  # signs them. The private key stays on the operator host and is used by
  # `pnpm audit:checkpoint`; only the public key is mounted here.
  AUDIT_CHECKPOINT_PUBLIC_KEY: ""
  ALLOW_PRIVATE_UPSTREAMS: "false"
  DASHBOARD_ORIGIN: "http://localhost:5173"
  # The gateway's accepted-policy-version anchor (backed by the gateway-state
  # PVC in gateway.yaml).
  GATEWAY_STATE_DIR: "/var/lib/traceguard/gateway-state"
  # OAuth resource-server mode (§7.3). Fill these in and set NODE_ENV=production
  # to run on real access tokens; leave them empty and the static dev keys in
  # the Secret keep working.
  NODE_ENV: ""
  OAUTH_ISSUER: ""
  OAUTH_AUDIENCE: ""
  OAUTH_JWKS_FILE: ""
  OAUTH_JWKS_URL: ""
