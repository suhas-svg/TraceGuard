# Runs every migration in filename order against the cluster database.
# Apply after postgres is ready and before the api and gateway roll out.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: traceguard
spec:
  backoffLimit: 3
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      restartPolicy: OnFailure
      # The Job is applied at the same time as postgres, so the container must
      # wait for the database itself — compose does this with depends_on.
      initContainers:
        - name: wait-for-postgres
          image: traceguard/migrate:v1.16.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "-c"]
          args:
            - until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done
          resources:
            requests: { memory: "32Mi", cpu: "50m" }
            limits: { memory: "128Mi" }
      containers:
        - name: migrate
          image: traceguard/migrate:v1.16.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              for f in $(ls /migrations/*.sql | sort); do
                echo "applying $f";
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f" || exit 1;
              done
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: traceguard-secrets, key: DATABASE_URL } }
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi" }
