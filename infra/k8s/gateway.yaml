apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: traceguard
spec:
  selector:
    app: gateway
  ports:
    - name: agent
      port: 8091
    - name: control
      port: 8093
    # ADR-0010: service-to-service discovery only. The NetworkPolicy admits
    # this port from api pods and nothing else.
    - name: internal
      port: 8094
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: traceguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: traceguard/api:v1.16.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          args: ["node", "apps/api/dist/gateway.js"]
          ports:
            - containerPort: 8091
            # §9: human approvals are served on a separate listener so
            # NetworkPolicy can keep it off the agent network entirely.
            - containerPort: 8093
            # ADR-0010: internal discovery listener; never exposed outside
            # the cluster and reachable only from the api pods.
            - containerPort: 8094
          env:
            - name: GATEWAY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: traceguard-secrets, key: GATEWAY_DB_PASSWORD } }
            # §13.4: enforcement connects as gateway_runtime, not as the owner.
            - name: DATABASE_URL
              value: postgres://gateway_runtime:$(GATEWAY_DB_PASSWORD)@postgres:5432/traceguard
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: traceguard-secrets, key: API_KEY } }
            - name: APPROVER_KEY
              valueFrom: { secretKeyRef: { name: traceguard-secrets, key: APPROVER_KEY } }
            - name: APPROVAL_ARGS_KEY
              valueFrom: { secretKeyRef: { name: traceguard-secrets, key: APPROVAL_ARGS_KEY } }
            # Present-but-empty by default; keeps pending rows sealed under the
            # previous key readable across a rotation.
            - name: APPROVAL_ARGS_KEY_PREVIOUS
              valueFrom: { secretKeyRef: { name: traceguard-secrets, key: APPROVAL_ARGS_KEY_PREVIOUS, optional: true } }
            - name: GATEWAY_PORT
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: GATEWAY_PORT } }
            - name: GATEWAY_CONTROL_PORT
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: GATEWAY_CONTROL_PORT } }
            - name: GATEWAY_INTERNAL_PORT
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: GATEWAY_INTERNAL_PORT } }
            - name: GATEWAY_INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: traceguard-secrets, key: GATEWAY_INTERNAL_TOKEN } }
            - name: CONTROL_API_URL
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: CONTROL_API_URL } }
            - name: APPROVAL_TTL_SECONDS
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: APPROVAL_TTL_SECONDS } }
            - name: APPROVAL_CLAIM_LEASE_SECONDS
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: APPROVAL_CLAIM_LEASE_SECONDS, optional: true } }
            - name: AUDIT_CHECKPOINT_PUBLIC_KEY
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: AUDIT_CHECKPOINT_PUBLIC_KEY, optional: true } }
            - name: ALLOW_PRIVATE_UPSTREAMS
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: ALLOW_PRIVATE_UPSTREAMS } }
            - name: DASHBOARD_ORIGIN
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: DASHBOARD_ORIGIN } }
            # §13.3: the accepted-policy-version anchor. It must live on a
            # volume that survives restarts, or a rolled-back pointer cannot
            # be told from a fresh deployment.
            - name: GATEWAY_STATE_DIR
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: GATEWAY_STATE_DIR } }
            # Identity mode (§7.3), as on the api Deployment.
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: NODE_ENV } }
            - name: OAUTH_ISSUER
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: OAUTH_ISSUER } }
            - name: OAUTH_AUDIENCE
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: OAUTH_AUDIENCE } }
            - name: OAUTH_JWKS_FILE
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: OAUTH_JWKS_FILE } }
            - name: OAUTH_JWKS_URL
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: OAUTH_JWKS_URL } }
          volumeMounts:
            - name: gateway-state
              mountPath: /var/lib/traceguard/gateway-state
          livenessProbe:
            httpGet: { path: /healthz, port: 8091 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: 8091 }
            periodSeconds: 5
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "512Mi" }
      volumes:
        - name: gateway-state
          persistentVolumeClaim:
            claimName: gateway-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-state
  namespace: traceguard
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
