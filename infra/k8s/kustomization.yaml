apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres.yaml
  - secrets.yaml
  - configmap.yaml
  - migrate-job.yaml
  - api.yaml
  - gateway.yaml
  - web.yaml

images:
  - name: traceguard/api
    newName: ghcr.io/suhas-svg/traceguard-api
    newTag: latest
  - name: traceguard/web
    newName: ghcr.io/suhas-svg/traceguard-web
    newTag: latest
  - name: traceguard/migrate
    newName: ghcr.io/suhas-svg/traceguard-migrate
    newTag: latest
