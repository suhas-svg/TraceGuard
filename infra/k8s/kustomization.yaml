apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres.yaml
  - secrets.yaml
  - configmap.yaml
  - migrate-job.yaml
  - api.yaml
  - gateway.yaml
  - web.yaml

images:
  - name: traceguard/api
    newName: ghcr.io/suhas-svg/traceguard-api
    newTag: v1.16.0
  - name: traceguard/web
    newName: ghcr.io/suhas-svg/traceguard-web
    newTag: v1.16.0
  - name: traceguard/migrate
    newName: ghcr.io/suhas-svg/traceguard-migrate
    newTag: v1.16.0

# newTag must name a published image (a released version, or a digest via
# newName: repo@sha256:...). The floating :latest tag made two applies of the
# same manifest run different code and left a rollout nothing to roll back to.
