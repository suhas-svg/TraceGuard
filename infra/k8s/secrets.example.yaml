# Copy to secrets.yaml and fill in before applying. Never commit secrets.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: traceguard-secrets
  namespace: traceguard
type: Opaque
stringData:
  POSTGRES_USER: traceguard
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: traceguard
  DATABASE_URL: postgres://traceguard:change-me@postgres:5432/traceguard
  # §13.4 least-privilege role passwords. The migrate Job enables these
  # logins; the api and gateway compose their connection URLs from them (the
  # owner DATABASE_URL above is only for the migrate Job).
  API_DB_PASSWORD: change-me-api
  GATEWAY_DB_PASSWORD: change-me-gateway
  RETENTION_DB_PASSWORD: change-me-retention
  PUBLISHER_DB_PASSWORD: change-me-publisher
  API_KEY: change-me
  APPROVER_KEY: change-me-too
  APPROVAL_ARGS_KEY: generate-with-crypto-randomBytes-32-hex
  # Keep the replaced key here until pending rows sealed under it expire.
  APPROVAL_ARGS_KEY_PREVIOUS: ""
