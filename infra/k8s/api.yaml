apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: traceguard
spec:
  selector:
    app: api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: traceguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: traceguard/api:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: traceguard-secrets, key: DATABASE_URL } }
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: traceguard-secrets, key: API_KEY } }
            - name: PORT
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: PORT } }
            - name: DASHBOARD_ORIGIN
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: DASHBOARD_ORIGIN } }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "512Mi" }
