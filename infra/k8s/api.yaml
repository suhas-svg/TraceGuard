apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: traceguard
spec:
  selector:
    app: api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: traceguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: traceguard/api:v1.16.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 8080
          env:
            # §13.4: the api runs as api_runtime and the retention sweep as
            # retention_job; the owner URL in DATABASE_URL is only for the
            # migrate Job. Kubernetes expands $(VAR) from earlier env entries.
            - name: API_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: traceguard-secrets, key: API_DB_PASSWORD } }
            - name: RETENTION_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: traceguard-secrets, key: RETENTION_DB_PASSWORD } }
            - name: DATABASE_URL
              value: postgres://api_runtime:$(API_DB_PASSWORD)@postgres:5432/traceguard
            - name: DATABASE_URL_RETENTION
              value: postgres://retention_job:$(RETENTION_DB_PASSWORD)@postgres:5432/traceguard
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: traceguard-secrets, key: API_KEY } }
            # The dashboard exchanges the approver key for a session on the API
            # listener too; empty keeps the dev fallback.
            - name: APPROVER_KEY
              valueFrom: { secretKeyRef: { name: traceguard-secrets, key: APPROVER_KEY } }
            # ADR-0010: discovery is delegated to the gateway's internal
            # listener; the API resolves no upstream credential itself.
            - name: GATEWAY_INTERNAL_URL
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: GATEWAY_INTERNAL_URL } }
            - name: GATEWAY_INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: traceguard-secrets, key: GATEWAY_INTERNAL_TOKEN } }
            - name: PORT
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: PORT } }
            - name: DASHBOARD_ORIGIN
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: DASHBOARD_ORIGIN } }
            # Identity mode (§7.3). NODE_ENV=production with the OAUTH_* keys
            # filled in runs on issuer-validated access tokens; empty values
            # keep the static development keys.
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: NODE_ENV } }
            - name: OAUTH_ISSUER
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: OAUTH_ISSUER } }
            - name: OAUTH_AUDIENCE
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: OAUTH_AUDIENCE } }
            - name: OAUTH_JWKS_FILE
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: OAUTH_JWKS_FILE } }
            - name: OAUTH_JWKS_URL
              valueFrom: { configMapKeyRef: { name: traceguard-config, key: OAUTH_JWKS_URL } }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "512Mi" }
