name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npx eslint .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: traceguard
          POSTGRES_PASSWORD: traceguard
          POSTGRES_DB: traceguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://traceguard:traceguard@localhost:5432/traceguard
      TEST_DATABASE_URL: postgres://traceguard:traceguard@localhost:5432/traceguard
      API_KEY: test_key
      APPROVER_KEY: test_approver
      APPROVAL_ARGS_KEY: abababababababababababababababababababababababababababababababab
      ALLOW_PRIVATE_UPSTREAMS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: ./node_modules/.bin/tsc -p packages/schemas/tsconfig.json
      - run: ./node_modules/.bin/tsc -p apps/api/tsconfig.json
      - run: ./node_modules/.bin/tsc -p apps/web/tsconfig.json
      - run: ./node_modules/.bin/tsc -p sdks/typescript/tsconfig.json
      - run: ./node_modules/.bin/tsc -p examples/demo-agent-ts/tsconfig.json
      - run: for f in apps/api/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done
      - run: ./node_modules/.bin/vitest run --root apps/api
      - run: ./node_modules/.bin/vitest run --root apps/web
      - run: ./node_modules/.bin/vitest run --root sdks/typescript

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "./sdks/python[dev]"
      - run: python -m pytest sdks/python

  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: traceguard
          POSTGRES_PASSWORD: traceguard
          POSTGRES_DB: traceguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://traceguard:traceguard@localhost:5432/traceguard_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: ./node_modules/.bin/tsc -p packages/schemas/tsconfig.json
      - run: npm run build -w apps/api -w apps/web
      - run: npx playwright test --config tests/e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
