name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # `packageManager` in package.json pins pnpm; corepack may fetch it on a cold
  # runner. Never block CI on an interactive download prompt.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec eslint .

  # NFR-006: a floor against committed credentials. Runs on the tracked tree
  # only, needs no network or extra action, and fails the PR on a finding.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/secret-scan.mjs

  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: traceguard
          POSTGRES_PASSWORD: traceguard
          POSTGRES_DB: traceguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://traceguard:traceguard@localhost:5432/traceguard
      TEST_DATABASE_URL: postgres://traceguard:traceguard@localhost:5432/traceguard
      API_KEY: test_key
      APPROVER_KEY: test_approver
      APPROVAL_ARGS_KEY: abababababababababababababababababababababababababababababababab
      ALLOW_PRIVATE_UPSTREAMS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # §20: dependency and license review over the pinned lockfile, plus a
      # production advisory gate. The SBOM is uploaded for release evidence.
      - name: Dependency and license review
        run: node scripts/dependency-audit.mjs --sbom sbom.cdx.json
      - name: Production dependency audit
        run: node scripts/advisory-audit.mjs
      - run: pnpm --filter @traceguard/schemas build
      - run: pnpm --filter @traceguard/canonical-json build
      - run: pnpm --filter @traceguard/policy-signing build
      - run: pnpm --filter @traceguard/audit-chain build
      - run: pnpm --filter @traceguard/mcp-client-shim build
      - run: pnpm --filter @traceguard/policy-publisher build
      - run: pnpm --filter @traceguard/api build
      - run: pnpm --filter @traceguard/web build
      - run: pnpm --filter @traceguard/sdk build
      - run: pnpm --filter demo-agent-ts build
      - run: for f in apps/api/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done
      - run: pnpm exec vitest run --root apps/api
      - run: pnpm exec vitest run --root apps/web
      - run: pnpm exec vitest run --root packages/canonical-json
      - run: pnpm exec vitest run --root packages/policy-signing
      - run: pnpm exec vitest run --root packages/audit-chain
      - run: pnpm exec vitest run --root packages/mcp-client-shim
      - run: pnpm exec vitest run --root tools/policy-publisher
      - run: pnpm exec vitest run --root sdks/typescript
      - name: Fault injection (database outage must fail closed)
        run: node tests/faults/run.mjs
      - name: OAuth clean-clone run
        run: node tests/oauth/clean-run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 7

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "./sdks/python[dev]"
      - run: python -m pytest sdks/python

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # check.py renders the kustomization, which references the gitignored
      # secret file. The example holds only placeholders, so the drift checks
      # (unresolvable refs, dangling selectors, missing probes or resources)
      # run on every change instead of only when someone remembers.
      - run: cp infra/k8s/secrets.example.yaml infra/k8s/secrets.yaml
      - run: python infra/k8s/check.py

  e2e:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: traceguard
          POSTGRES_PASSWORD: traceguard
          POSTGRES_DB: traceguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://traceguard:traceguard@localhost:5432/traceguard_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      # apps/api imports these workspaces, so their dist/ must exist before
      # the api build - the e2e job does not inherit build-and-test's output.
      - run: pnpm --filter @traceguard/api... build
      - run: pnpm --filter @traceguard/web build
      - run: pnpm exec playwright test --config tests/e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  # FR-004: an agent container on agent_edge must not reach the upstream tools
  # network, by service name or by IP, while the gateway answers on the same
  # edge. This builds the real images, so it also keeps the Dockerfiles honest.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Bring up the boundary
        run: |
          printf 'APPROVAL_ARGS_KEY=%s\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --build --wait gateway mock-tools agent api
      - run: pnpm run test:security
      - name: Tear down
        if: always()
        run: docker compose down -v
